apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: nginx-app
  namespace: production

spec:
  replicas: 3

  revisionHistoryLimit: 2

  selector:
    matchLabels:
      app: nginx-app

  strategy:
    canary:
      stableService: nginx-service
      canaryService: nginx-canary

      steps:
        - setWeight: 10
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 100

  template:
    metadata:
      labels:
        app: nginx-app

    spec:
      containers:
        - name: nginx
          image: nginx:1.29
          ports:
            - containerPort: 80
