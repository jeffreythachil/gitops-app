apiVersion: v1
kind: ServiceAccount
metadata:
  name: node-exporter
  namespace: monitoring

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: node-exporter

  template:
    metadata:
      labels:
        app: node-exporter

    spec:
      serviceAccountName: node-exporter

      hostNetwork: true
      hostPID: true

      containers:
        - name: node-exporter
          image: quay.io/prometheus/node-exporter:v1.9.1

          args:
            - "--path.rootfs=/host/root"

          ports:
            - containerPort: 9100
              hostPort: 9100

          volumeMounts:
            - name: root
              mountPath: /host/root
              readOnly: true

      volumes:
        - name: root
          hostPath:
            path: /
